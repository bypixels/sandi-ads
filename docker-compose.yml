name: sandi-ads

services:
  postgres:
    image: postgres:16-alpine
    container_name: sandi-ads-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: sandi_ads
      POSTGRES_PASSWORD: sandi_ads_dev
      POSTGRES_DB: sandi_ads
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - sandi_ads_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandi_ads -d sandi_ads"]
      interval: 5s
      timeout: 3s
      retries: 10

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sandi-ads-dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # DB_URL points at the postgres service via the compose network
      DATABASE_URL: postgres://sandi_ads:sandi_ads_dev@postgres:5432/sandi_ads
      DASHBOARD_ENABLED: "true"
      DASHBOARD_PORT: "3737"
      DASHBOARD_HOST: "0.0.0.0"
      # Authentication required; access key bootstrapped in persistent /data.
      DASHBOARD_AUTH_REQUIRED: "${DASHBOARD_AUTH_REQUIRED:-true}"
      # Mutations off by default. Override in .env to enable.
      MUTATIONS_ENABLED: "${MUTATIONS_ENABLED:-false}"
    ports:
      - "127.0.0.1:3737:3737"
    volumes:
      # Persists encrypted credentials, legacy import archives, and logs across restarts.
      - sandi_ads_data:/data

volumes:
  sandi_ads_pg_data:
  sandi_ads_data:
